<!DOCTYPE html>
<html>
<head>
    <title>gdx-teavm</title>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #canvas {
            border: none;
        }
    </style>
</head>
<body oncontextmenu="return false">
<div>
    <canvas id="canvas"></canvas>
</div>

<script>
    function loadScriptDynamically(url) {
        return new Promise((resolve, reject) => {
            console.log("Лоадер: Загрузка скрипта " + url + "...");
            const script = document.createElement("script");
            script.type = "text/javascript";
            script.charset = "utf-8";
            script.src = url;
            script.onload = () => {
                console.log("Лоадер: Скрипт " + url + " успешно выполнен.");
                resolve();
            };
            script.onerror = () => reject(new Error("Не удалось загрузить скрипт: " + url));
            document.body.appendChild(script);
        });
    }

    function waitForGlobalObject(objectName, timeout = 5000) {
        return new Promise((resolve, reject) => {
            if (window[objectName]) return resolve(window[objectName]);
            const startTime = Date.now();
            const interval = setInterval(() => {
                if (window[objectName]) {
                    clearInterval(interval);
                    resolve(window[objectName]);
                } else if (Date.now() - startTime > timeout) {
                    clearInterval(interval);
                    reject(new Error("Таймаут ожидания объекта window." + objectName));
                }
            }, 20);
        });
    }

    async function start() {
        try {
            // ШАГ 1: Загружаем модифицированный gdx-basis-universal.js
            await loadScriptDynamically("gdx-basis-universal.js");

            // ШАГ 2: Загружаем рантайм TeaVM
            await loadScriptDynamically("wasm-gc-runtime.min.js");

            // ШАГ 3: Ожидаем TeaVM
            console.log("Лоадер: Ожидание создания объекта TeaVM...");
            await waitForGlobalObject("TeaVM");

            // ШАГ 4: Запуск игры
            console.log("TeaVM WasmGC: Инициализация приложения...");
            let teavm = await TeaVM.wasmGC.load("app.wasm");
            teavm.exports.main([]);
        } catch (error) {
            console.error("Критическая ошибка при старте игры: ", error);
        }
    }

    window.addEventListener("load", start);
</script>
